[project]
name = "ymoney"
version = "0.1.0"
description = "YMONEY - autonomous AI short-form content operating system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
    "edge-tts>=7.0.0",
    "pyjwt>=2.10.1",
    "loguru>=0.7.3",
    "python-multipart>=0.0.20",
    "cryptography>=44.0.0",
    "boto3>=1.35.0",
    "sentry-sdk>=2.15.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.6",
    "respx>=0.22.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Skip live network tests by default; run with -m live to include them.
addopts = "-m 'not live'"
# A hung test must fail visibly instead of stalling the whole suite (CI gate).
# Generous ceiling: a healthy run of the full suite stays far below this.
timeout = 240
# Markers used to classify tests that need a running stack or real providers.
markers = [
    "live: requires a running dev stack or real provider (skipped by default)",
    "slow: longer-running integration coverage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


