name: ymoney

services:
  # MoneyPrinterTurbo was removed as a vendored copy (commit 5fddf48); the only
  # integration left is the HTTP adapter in providers/video_engine/mpt.py, which
  # is used only when VIDEO_ENGINE=moneyprinterturbo. The default
  # VIDEO_ENGINE=ffmpeg_avatar renders in-process and needs no sidecar.
  #
  # To run that optional lane, point an existing MPT deployment at this stack:
  #   MPT_BASE_URL=http://<mpt-host>:8080
  # and start it yourself — it is deliberately not built from this repo.

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      YMONEY_ENV: ${YMONEY_ENV:-production}
      YMONEY_SECRET_KEY: ${YMONEY_SECRET_KEY:?set a strong secret}
      DATABASE_URL: sqlite:////data/ymoney.db
      VIDEO_ENGINE: ${VIDEO_ENGINE:-ffmpeg_avatar}
      # Only read by the moneyprinterturbo adapter; harmless when unset.
      MPT_BASE_URL: ${MPT_BASE_URL:-}
      MONEYPRINTERTURBO_BASE_URL: ${MPT_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MOCK_TRENDS: ${MOCK_TRENDS:-false}
      MOCK_PUBLISHING: ${MOCK_PUBLISHING:-false}
      UPLOAD_POST_API_KEY: ${UPLOAD_POST_API_KEY:-}
      UPLOAD_POST_USERNAME: ${UPLOAD_POST_USERNAME:-}
      MOCK_ANALYTICS: ${MOCK_ANALYTICS:-false}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - ymoney-data:/data

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
    depends_on:
      - backend

volumes:
  ymoney-data:
