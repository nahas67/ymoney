name: ymoney

services:
  # Video engine (MoneyPrinterTurbo) — YMONEY talks to it over HTTP.
  video-engine:
    build:
      context: ./MoneyPrinterTurbo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      YMONEY_ENV: ${YMONEY_ENV:-production}
      YMONEY_SECRET_KEY: ${YMONEY_SECRET_KEY:?set a strong secret}
      DATABASE_URL: sqlite:////data/ymoney.db
      VIDEO_ENGINE: moneyprinterturbo
      MPT_BASE_URL: http://video-engine:8080
      MOCK_LLM: ${MOCK_LLM:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MOCK_TRENDS: ${MOCK_TRENDS:-false}
      MOCK_PUBLISHING: ${MOCK_PUBLISHING:-true}
      UPLOAD_POST_API_KEY: ${UPLOAD_POST_API_KEY:-}
      UPLOAD_POST_USERNAME: ${UPLOAD_POST_USERNAME:-}
      MOCK_ANALYTICS: ${MOCK_ANALYTICS:-true}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - ymoney-data:/data
    depends_on:
      video-engine:
        condition: service_started

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
    depends_on:
      - backend

volumes:
  ymoney-data:
